<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Test conexiune asistent AI — Termocor</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;max-width:640px;margin:32px auto;padding:0 20px;color:#1B2430;line-height:1.5;}
  h1{font-size:1.3rem;}
  button{background:#DD4E28;color:#fff;border:0;border-radius:4px;padding:12px 22px;font-size:1rem;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  pre{background:#F8F6F0;border:1px solid #D6D0C0;border-radius:4px;padding:16px;white-space:pre-wrap;word-break:break-word;font-size:.9rem;}
  .note{color:#4E5D6C;font-size:.9rem;}
</style>
</head>
<body>
<h1>Test conexiune asistent AI</h1>
<p class="note">Apasă butonul, așteaptă câteva secunde, apoi copiază tot textul de mai jos și trimite-l. Testul trimite un singur mesaj scurt către asistent, deci consumă o fracțiune minimă din credit.</p>
<p><button id="run">Rulează testul</button></p>
<pre id="out">Aștept să apeși butonul...</pre>

<script>
(function(){
  const WORKER_URL = 'https://termocorchat.vyper1309-cc.workers.dev/';
  const out = document.getElementById('out');
  const btn = document.getElementById('run');
  let lines = [];
  function log(t){ lines.push(t); out.textContent = lines.join('\n'); }

  async function attempt(url, opts, ms){
    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); }, ms);
    try {
      const res = await fetch(url, Object.assign({}, opts, { signal: ctrl.signal }));
      let body = '';
      try { body = await res.text(); } catch (e) {}
      return { ok: true, status: res.status, body: body };
    } catch (e) {
      return { ok: false, error: (e && e.name) + ': ' + (e && e.message) };
    } finally { clearTimeout(timer); }
  }
  function show(label, r){
    if (r.ok) log(label + ': HTTP ' + r.status + '  ' + r.body.slice(0, 200));
    else log(label + ': EȘUAT (' + r.error + ')');
  }

  btn.addEventListener('click', async function(){
    btn.disabled = true;
    lines = [];
    log('Adresa paginii: ' + location.href);
    log('Origine: ' + location.origin);
    log('Worker: ' + WORKER_URL);
    log('');

    // 1. Ajunge cererea la Worker? (fără CORS)
    const s1 = await attempt(WORKER_URL, { mode: 'no-cors' }, 15000);
    log('1. Worker accesibil din browser: ' + (s1.ok ? 'DA' : 'NU (' + s1.error + ')'));

    // 2. Test de sănătate cu CORS (GET simplu, fără cost)
    const s2 = await attempt(WORKER_URL, { method: 'GET' }, 15000);
    show('2. Test de sănătate (GET cu CORS)', s2);

    // 3. Cerere reală, ca în chat: text/plain, fără preflight
    const s3 = await attempt(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ messages: [{ role: 'user', content: 'Test: răspunde cu un singur cuvânt.' }] })
    }, 25000);
    show('3. Cerere reală (text/plain, fără preflight)', s3);

    // 4. Cerere JSON cu preflight, cu corp gol (fără cost; așteptăm 400)
    const s4 = await attempt(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [] })
    }, 15000);
    show('4. Cerere JSON cu preflight (corp gol, fără cost)', s4);

    log('');
    let msg;
    if (!s1.ok) {
      msg = 'Cererea nu ajunge deloc la Worker. Cauze posibile: o extensie de tip ad-blocker sau protecție de confidențialitate, o rețea/firewall care blochează workers.dev, sau lipsă de internet. Încearcă fără extensii, în fereastră incognito, sau de pe telefon pe date mobile.';
    } else if (!s2.ok) {
      msg = 'Worker-ul răspunde, dar browserul îi blochează răspunsul (CORS) chiar și la un test simplu. Cel mai probabil codul din Worker nu s-a publicat corect: în Cloudflare, Edit code → ștergi tot → lipești termocor-ai-worker.js → Deploy. Verifică și că adresa Origine de mai sus e exact https://vyper1309cc-ship-it.github.io';
    } else if (s2.status === 403) {
      msg = 'Worker-ul refuză adresa acestei pagini (' + location.origin + '). Trebuie să fie exact https://vyper1309cc-ship-it.github.io';
    } else if (s2.status !== 200) {
      msg = 'Worker-ul rulează o versiune veche a codului (răspunde cu ' + s2.status + ' la testul de sănătate). Lipește ultima versiune din termocor-ai-worker.js în Cloudflare (Edit code) și dă Deploy.';
    } else if (s3.ok && s3.status === 200) {
      msg = 'TOTUL FUNCȚIONEAZĂ: asistentul AI e conectat corect.' + (s4.ok ? '' : ' (Cererea JSON cu preflight e blocată de browser, dar chatul nu o folosește, deci nu contează.)');
    } else if (!s3.ok) {
      msg = 'Testul de sănătate trece, dar cererea reală e blocată de browser. Trimite-mi tot textul de mai sus.';
    } else if (s3.status === 500) {
      msg = 'Eroare în Worker (vezi conținutul de la pasul 3). Dacă scrie not_configured, secretul ANTHROPIC_API_KEY lipsește sau nu ai dat Deploy după ce l-ai adăugat.';
    } else if (s3.status === 502) {
      msg = 'Worker-ul a ajuns la Anthropic, dar acesta a refuzat. La pasul 3: upstream_status 401 = cheie greșită; 400 = de obicei credit lipsă în contul Anthropic (Billing).';
    } else {
      msg = 'Răspuns neașteptat la pasul 3 (' + s3.status + '). Trimite-mi tot textul de mai sus.';
    }
    log('CONCLUZIE: ' + msg);
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
